<!DOCTYPE html>
<html lang="en">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <?!= include('Styles'); ?>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar">
      <h1>Expenses</h1>
      <div class="controls">
        <label class="field">
          <span class="field-label">Month</span>
          <select id="month-select" disabled></select>
        </label>
        <button type="button" id="refresh-btn" class="btn">Refresh data</button>
        <button type="button" id="settings-btn" class="btn btn-ghost" aria-haspopup="dialog">Settings</button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div id="status" class="status" role="status" aria-live="polite">Loading…</div>
      <div id="error" class="error" role="alert" hidden></div>

      <div id="dashboard" class="grid" hidden>
        <section class="card span-2" aria-labelledby="pace-title">
          <div class="card-head">
            <h2 id="pace-title">Month pace</h2>
            <span id="pace-badge"></span>
          </div>
          <div id="pace"></div>
        </section>

        <section class="card" aria-labelledby="weekly-title">
          <div class="card-head">
            <h2 id="weekly-title">Weekly control</h2>
            <div class="segmented" role="group" aria-label="Week">
              <button type="button" class="seg" data-week="thisWeek" aria-pressed="true">This week</button>
              <button type="button" class="seg" data-week="lastWeek" aria-pressed="false">Last week</button>
            </div>
          </div>
          <p id="weekly-range" class="muted small"></p>
          <div id="weekly"></div>
        </section>

        <section class="card" aria-labelledby="trend-title">
          <div class="card-head">
            <h2 id="trend-title">6-month trend</h2>
          </div>
          <div id="trend" class="chart-wrap"></div>
        </section>

        <section class="card span-2" aria-labelledby="cat-title">
          <div class="card-head">
            <h2 id="cat-title">Categories of the month</h2>
          </div>
          <div id="categories"></div>
        </section>

        <section class="card" aria-labelledby="tx-title">
          <div class="card-head">
            <h2 id="tx-title">Latest transactions</h2>
          </div>
          <div id="transactions" class="table-wrap"></div>
        </section>

        <section class="card" aria-labelledby="dq-title">
          <div class="card-head">
            <h2 id="dq-title">Data quality</h2>
          </div>
          <div id="quality"></div>
        </section>
      </div>
      <p id="footer" class="muted small footer"></p>
    </main>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <form id="settings-form" method="dialog">
        <h2 id="settings-title">Settings</h2>
        <fieldset>
          <legend>Watched categories (weekly control)</legend>
          <div id="watched-list" class="check-grid"></div>
        </fieldset>
        <label class="field field-block">
          <span class="field-label">Monthly cap (% of income)</span>
          <input id="cap-input" type="number" min="1" max="100" step="0.5" required inputmode="decimal">
        </label>
        <p class="muted small">Budgets and income come from the spreadsheet. Settings are saved to your account.</p>
        <p id="settings-error" class="error-inline" role="alert" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="settings-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" id="settings-save" class="btn btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="category-dialog" aria-labelledby="category-title">
      <h2 id="category-title"></h2>
      <div id="category-body"></div>
      <div class="dialog-actions">
        <button type="button" id="category-close" class="btn btn-primary">Close</button>
      </div>
    </dialog>

    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

    <?!= include('Client'); ?>
  </body>
</html>
