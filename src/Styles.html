<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2;
    --surface: #fcfcfb;
    --surface-2: #f0efec;
    --border: #dddcd7;
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #686762;
    --accent: #1c5cab;
    --accent-ink: #ffffff;
    --series: #2a78d6;
    --series-soft: #b7d3f6;
    --track: #e7e6e2;
    --cap-line: #0b0b0b;
    --good: #0ca30c;
    --good-ink: #006300;
    --warning: #fab219;
    --warning-ink: #8a5a00;
    --critical: #d03b3b;
    --critical-ink: #b42323;
    --focus: #1c5cab;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(0, 0, 0, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #111110;
      --surface: #1a1a19;
      --surface-2: #242422;
      --border: #383835;
      --text: #ffffff;
      --text-2: #c3c2b7;
      --muted: #a3a29a;
      --accent: #6da7ec;
      --accent-ink: #0b0b0b;
      --series: #3987e5;
      --series-soft: #184f95;
      --track: #2e2e2c;
      --cap-line: #ffffff;
      --good-ink: #5fd35f;
      --warning-ink: #fab219;
      --critical-ink: #f08080;
      --focus: #86b6ef;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1, h2 { margin: 0; line-height: 1.2; }
  h1 { font-size: 1.35rem; }
  h2 { font-size: 1rem; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .skip-link { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 10; }
  .skip-link:focus { left: 8px; }
  .visually-hidden {
    position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* Layout */
  .topbar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    padding: 16px clamp(16px, 4vw, 32px);
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  main { padding: 16px clamp(16px, 4vw, 32px) 32px; max-width: 1200px; margin: 0 auto; }
  main:focus { outline: none; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .span-2 { grid-column: span 2; }
  @media (max-width: 760px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .span-2 { grid-column: auto; }
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow); min-width: 0;
  }
  .card-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .footer { margin-top: 16px; text-align: center; }

  /* Controls */
  .field { display: inline-flex; align-items: center; gap: 6px; }
  .field-block { display: flex; flex-direction: column; align-items: flex-start; margin: 12px 0; }
  .field-label { font-size: .85rem; color: var(--text-2); }
  select, input[type="number"] {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; min-height: 36px;
  }
  .btn {
    font: inherit; font-weight: 500; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; min-height: 36px; cursor: pointer;
  }
  .btn:hover { border-color: var(--text-2); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn-ghost { background: transparent; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg { font: inherit; font-size: .85rem; background: transparent; color: var(--text-2); border: 0; padding: 4px 10px; min-height: 32px; cursor: pointer; }
  .seg[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  /* Status / errors */
  .status { color: var(--muted); padding: 8px 0; }
  .status:empty { display: none; }
  .error {
    border: 1px solid var(--critical); border-left-width: 6px; background: var(--surface);
    border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
  }
  .error h2 { color: var(--critical-ink); margin-bottom: 6px; }
  .error code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .error-inline { color: var(--critical-ink); }

  /* Status chips: icon + label, never color alone */
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
  .chip .ico { font-size: .9em; }
  .chip-good { color: var(--good-ink); }
  .chip-warning { color: var(--warning-ink); }
  .chip-critical { color: var(--critical-ink); }
  .chip-none { color: var(--muted); }

  /* Pace */
  .kpis { display: flex; flex-wrap: wrap; gap: 8px 32px; margin-bottom: 16px; }
  .kpi-label { font-size: .8rem; color: var(--text-2); }
  .kpi-value { font-size: 1.6rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kpi-value.sm { font-size: 1.15rem; }
  .meter { position: relative; height: 14px; background: var(--track); border-radius: 7px; margin: 28px 0 28px; }
  .meter-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series); border-radius: 7px; }
  .meter-fill.over { background: var(--critical); }
  .meter-proj { position: absolute; top: 0; bottom: 0; background: var(--series-soft); border-radius: 0 7px 7px 0; }
  .meter-mark { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--cap-line); }
  /* Centered on its marker via transform; positionMeterLabels() then switches to
     a px left that is clamped to the meter so labels never clip at the edges. */
  .meter-mark-label { position: absolute; font-size: .75rem; color: var(--text-2); white-space: nowrap; transform: translateX(-50%); }
  .meter-mark-label.placed { transform: none; }
  .meter-mark-label.top { top: -24px; }
  .meter-mark-label.bottom { bottom: -24px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .8rem; color: var(--text-2); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  /* Rows with mini bars */
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { padding: 10px 0; border-top: 1px solid var(--border); }
  .rows li:first-child { border-top: 0; padding-top: 0; }
  .row-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; }
  .row-name { font-weight: 600; }
  .row-sub { font-size: .85rem; color: var(--text-2); }
  .bar { position: relative; height: 8px; background: var(--track); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series); border-radius: 4px; }
  .bar-fill.over { background: var(--critical); }
  .bar-tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--cap-line); opacity: .6; }
  .cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; }
  @media (max-width: 760px) { .cat-grid { grid-template-columns: minmax(0, 1fr); } }
  .cat-grid li:nth-child(2) { border-top: 0; padding-top: 0; }
  @media (max-width: 760px) { .cat-grid li:nth-child(2) { border-top: 1px solid var(--border); padding-top: 10px; } }

  /* Chart */
  .chart-wrap { width: 100%; }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-wrap .bar-mark { fill: var(--series); }
  .chart-wrap .bar-mark.over { fill: var(--critical); }
  .chart-wrap .bar-mark.selected { stroke: var(--text); stroke-width: 2; }
  .chart-wrap .hit { fill: transparent; cursor: default; }
  .chart-wrap .hit:focus { outline: none; }
  .chart-wrap .hit:focus-visible + .bar-mark, .chart-wrap g:hover .bar-mark { opacity: .85; }
  .chart-wrap .hit:focus-visible { stroke: var(--focus); stroke-width: 3; }
  .chart-wrap .axis-text { fill: var(--text-2); font-size: 12px; }
  .chart-wrap .val-text { fill: var(--text-2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart-wrap .grid-line { stroke: var(--border); stroke-width: 1; }
  .chart-wrap .cap-line { stroke: var(--cap-line); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .chart-wrap .cap-text { fill: var(--text); font-size: 11px; font-weight: 600; }
  details.table-toggle { margin-top: 8px; font-size: .85rem; }
  details.table-toggle summary { cursor: pointer; color: var(--text-2); }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: .8rem; color: var(--text-2); font-weight: 600; }
  td.amt, th.amt { text-align: right; }
  td.note { max-width: 16em; overflow-wrap: anywhere; }
  .empty-note { color: var(--muted); font-style: italic; }

  /* Data quality */
  .dq { list-style: none; margin: 0; padding: 0; }
  .dq > li { padding: 10px 0; border-top: 1px solid var(--border); }
  .dq > li:first-child { border-top: 0; padding-top: 0; }
  .dq-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .dq details { margin-top: 4px; font-size: .85rem; }
  .dq details summary { cursor: pointer; color: var(--text-2); }
  .dq ul.items { margin: 6px 0 0; padding-left: 18px; }

  /* Tooltip */
  .tooltip {
    position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: .85rem;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
  }

  /* Settings dialog */
  dialog {
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text);
    padding: 20px; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  fieldset { border: 1px solid var(--border); border-radius: 8px; margin: 16px 0 0; padding: 8px 12px 12px; }
  legend { font-size: .85rem; color: var(--text-2); padding: 0 4px; }
  .check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 12px; }
  .check-grid label { display: flex; gap: 6px; align-items: center; min-height: 28px; }
  .check-grid input { width: 18px; height: 18px; accent-color: var(--accent); }
  .cat-item { cursor: pointer; }
  .cat-item:hover .row-name { text-decoration: underline; }
  #category-dialog { width: min(640px, calc(100vw - 32px)); }
  #category-body { overflow-y: auto; max-height: calc(100vh - 200px); margin-top: 12px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  @media (prefers-reduced-motion: no-preference) {
    .meter-fill, .bar-fill { transition: width .3s ease; }
  }
  @media (forced-colors: active) {
    .meter-fill, .bar-fill, .bar-mark { forced-color-adjust: none; }
  }
</style>
